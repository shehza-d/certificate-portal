<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101a35" />
    <title>Certificate Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
        <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Certification portal</p>
        <h1 id="page-title">Find your certificate</h1>
        <p class="intro">Search using your roll no., name, or father’s name.</p>

        <label class="search-box" for="certificate-search">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input
            id="certificate-search"
            type="search"
            placeholder="e.g. 870790, Abdul Hadi, or Shakeel"
            autocomplete="off"
          />
        </label>
        <p id="search-hint" class="search-hint">
          Start typing to find your certificate.
        </p>
      </section>

      <section
        class="results-section"
        aria-live="polite"
        aria-label="Certificate results"
      >
        <div id="results" class="results"></div>
      </section>
    </main>

    <footer>
      <span>Need help?</span>
      <a
        href="https://wa.me/923033111499"
        target="_blank"
        id="management-contact"
        >Contact</a
      >
      <span class="footer-divider" aria-hidden="true">•</span>
      <span>Built by Shehzad</span>
    </footer>

    <dialog id="teacher-note-dialog" class="note-dialog" aria-labelledby="note-dialog-title">
      <button id="note-dialog-close" class="note-dialog-close" type="button" aria-label="Close teacher note">×</button>
      <div id="note-dialog-body"></div>
      <div class="note-dialog-footer">
        <a id="note-dialog-view" class="button" target="_blank" rel="noopener" hidden>Open certificate</a>
      </div>
    </dialog>

    <script src="data.js?v=20260920"></script>
    <script src="teacher-note.js?v=20260920"></script>
    <script src="script.js?v=20260920-meta-spacing"></script>
  </body>
</html>
